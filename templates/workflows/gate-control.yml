name: gate-control

# Template: copy to .github/workflows/gate-control.yml, beside gate.yml.
# Label and close events for the gate. They must not start gate.yml itself: a job `if:` that skips them would leave a
# skipped check run named like the required check on the PR head, and GitHub counts a skipped check as passing, so
# auto-merge could merge before the real gate finished. The job here has another name, so no event but a real gate run
# ever produces the required check.
#   closed (merged too): cancel the PR's in-flight gate run.
#   the accept-a-drop label added or removed: rerun the gate of the open PR's current head, which reads the label at
#   run time. Auto-merge is paused across a removal. Any other label does nothing.
# Repository variables: GATE_CHECK_NAME (default table-diff), GATE_OK_LABEL (default gate-drop-ok).
on:
  pull_request:
    types: [labeled, unlabeled, closed]

# One control run per PR, never cancelled midway (a cancelled rerun could leave the gate cancelled).
concurrency:
  group: gate-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed' || github.event.label.name == (vars.GATE_OK_LABEL || 'gate-drop-ok'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write  # pause and restore auto-merge
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      ACTION: ${{ github.event.action }}
      CHECK: ${{ vars.GATE_CHECK_NAME || 'table-diff' }}
    steps:
      - name: Cancel or rerun the PR's gate run
        shell: bash
        run: |
          # The PR as it is now, not as the event saw it: a push may have landed since.
          read -r state head auto < <(gh pr view "$PR" --json state,headRefOid,autoMergeRequest -q '"\(.state) \(.headRefOid) \(.autoMergeRequest.mergeMethod // "-")"')
          if [ "$ACTION" != closed ] && [ "$state" != OPEN ]; then echo "PR is $state: nothing to rerun"; exit 0; fi
          # the newest gate.yml run of that head commit
          run=$(gh run list --workflow gate.yml --event pull_request --commit "$head" --limit 1 --json databaseId,status -q '.[0] | "\(.databaseId) \(.status)"')
          if [ -z "$run" ]; then echo "no gate run on $head (docs-only change?)"; exit 0; fi
          id=${run% *}; status=${run#* }
          active=false; case "$status" in queued|in_progress|waiting|requested|pending) active=true;; esac
          if [ "$ACTION" = closed ]; then
            if $active; then gh run cancel "$id"; echo "cancelled gate run $id"; fi
            exit 0
          fi
          # Removing the label: the old green check stays on the head until the rerun starts, and auto-merge could fire
          # in that gap. Pause auto-merge first and restore it once the rerun has reset the check.
          paused=false
          if [ "$ACTION" = unlabeled ] && [ "$auto" != "-" ]; then
            if ! gh pr merge "$PR" --disable-auto; then
              echo "::error::could not pause auto-merge, so the gate was not rerun: the old green check could merge the PR. Rerun the gate by hand."
              exit 1
            fi
            paused=true
          fi
          if $active; then
            gh run cancel "$id"
            ended=false
            for i in $(seq 1 60); do
              if [ "$(gh run view "$id" --json status -q .status)" = completed ]; then ended=true; break; fi
              sleep 5
            done
            if ! $ended; then
              msg="gate run $id was still running 300 s after the cancel request, so it was not rerun. Rerun it by hand once it ends."
              $paused && msg="$msg Auto-merge stays paused: re-enable it after the rerun."
              echo "::error::$msg"
              exit 1
            fi
          fi
          gh run rerun "$id"
          echo "reran gate run $id"
          if $paused; then
            # restore auto-merge only once the rerun's new check is on the head and not completed (<= 60 s)
            queued=false
            for i in $(seq 1 12); do
              n=$(gh api "repos/$GH_REPO/commits/$head/check-runs?check_name=$CHECK&filter=latest" -q '[.check_runs[] | select(.status != "completed")] | length')
              if [ "$n" -gt 0 ]; then queued=true; break; fi
              sleep 5
            done
            if ! $queued; then
              echo "::error::the rerun's $CHECK check did not show up on $head within 60 s. Auto-merge stays paused: re-enable it once the gate is running."
              exit 1
            fi
            gh pr merge "$PR" --auto "--$(echo "$auto" | tr A-Z a-z)"
            echo "auto-merge restored"
          fi
